name: Release

# Déclenché par le tag annoté vX.Y.Z que tu pousses à la main.
# Le tag EST ta cérémonie d'autorisation ; rien ne se publie sans lui.
on:
  push:
    tags: ["v*"]

# Défaut global : lecture seule, partout. Chaque job élève ce dont il a besoin.
permissions:
  contents: read

env:
  # Deps liées statiquement, construites depuis la source et vérifiées par SHA-256.
  JANSSON_URL: https://github.com/akheron/jansson/releases/download/v2.14/jansson-2.14.tar.gz
  JANSSON_SHA: 5798d010e41cf8d76b66236cfb2f2543c8d082181d16bc3085ab49538d4b9929
  URIPARSER_URL: https://github.com/uriparser/uriparser/releases/download/uriparser-1.0.2/uriparser-1.0.2.tar.gz
  URIPARSER_SHA: 963554c32d40fb6cba5644f1ba63e6dd7a182b2948bd71ee448c532f53b07f1e

jobs:
  # ─── RÔLE « CONSTRUIT » : aucun droit d'écriture, aucun secret ───
  # Ce job exécute le Makefile. C'est le seul endroit où du code candidat
  # s'exécute — donc le seul endroit où un RCE pourrait vivre. Il ne peut
  # ni publier, ni pousser, ni toucher à un token d'écriture.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-14
            target: macos-arm64
          - os: macos-13
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read        # ne peut pas modifier le dépôt
      id-token: write       # OIDC, requis par l'attestation de provenance
      attestations: write   # écrit l'attestation — ce n'est PAS contents: write
    steps:
      # TODO(sécurité) : épingler chaque action sur son SHA 40-hex complet
      # avant merge. Un tag comme @v4 est mutable ; seul le SHA est immuable.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifie que le tag correspond à VERSION
        shell: bash
        run: |
          set -euo pipefail
          file_version="$(cat VERSION)"
          test "v${file_version}" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} != v${file_version} (fichier VERSION)"; exit 1; }

      - name: Chaîne d'outils + deps dynamiques
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential cmake pkg-config \
              libjansson-dev liburiparser-dev
          else
            brew install cmake jansson uriparser
            echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "${GITHUB_ENV}"
          fi

      - name: Build + empaquète les deux variantes
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          mkdir -p dist

          package() {   # $1 = étiquette de variante (dynamic|static)
            local name="mcp-runtime-${version}-${{ matrix.target }}-$1"
            rm -rf stage && mkdir -p stage
            make install DESTDIR="${PWD}/stage" PREFIX=/usr/local
            tar -czf "dist/${name}.tar.gz" -C stage .
            ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          }

          # ── Variante DYNAMIQUE : liée aux libs système (apt/brew) ──
          make clean
          make all
          make check          # gate de correction, identique à la CI de branche
          package dynamic

          # ── Variante STATIQUE : jansson+uriparser depuis la source, liées .a ──
          # libc/libSystem reste dynamique (fully-static impossible sur macOS) ;
          # le binaire ne dépend plus que du système, pas des deps.
          deps="${PWD}/.deps-static"
          rm -rf "${deps}" srcdeps && mkdir -p srcdeps && cd srcdeps
          curl -fsSL -o jansson.tar.gz "${JANSSON_URL}"
          echo "${JANSSON_SHA}  jansson.tar.gz" | shasum -a 256 -c -
          curl -fsSL -o uriparser.tar.gz "${URIPARSER_URL}"
          echo "${URIPARSER_SHA}  uriparser.tar.gz" | shasum -a 256 -c -
          tar xzf jansson.tar.gz && tar xzf uriparser.tar.gz
          cmake -S jansson-2.14 -B jb -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DJANSSON_BUILD_SHARED_LIBS=OFF \
            -DJANSSON_BUILD_DOCS=OFF -DJANSSON_WITHOUT_TESTS=ON \
            -DJANSSON_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="${deps}" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build jb --target install
          cmake -S uriparser-1.0.2 -B ub -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DURIPARSER_BUILD_DOCS=OFF \
            -DURIPARSER_BUILD_TESTS=OFF -DURIPARSER_BUILD_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX="${deps}" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build ub --target install
          cd ..
          make clean
          make all \
            MCP_DEP_CFLAGS="-I${deps}/include" \
            MCP_DEP_LIBS="${deps}/lib/libjansson.a ${deps}/lib/liburiparser.a"
          ./build/release/bin/maelys-mcp --help >/dev/null   # smoke : le binaire static tourne
          package static

          echo "Artefacts produits :"; ls -1 dist

      # Lie cryptographiquement CHAQUE tarball à ce commit, ce workflow, ce runner.
      - name: Atteste la provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Publie les artefacts internes
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # ─── RÔLES « AUTORISE » + « PUBLIE » : seul job avec contents: write ───
  # Il ne compile RIEN. Il télécharge des tarballs déjà construits, vérifie
  # leurs checksums (lecture d'octets, aucune exécution de code candidat),
  # et les attache à la Release. L'environnement `release` suspend ce job
  # jusqu'à ton approbation explicite.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # LE seul endroit du workflow
    environment: release
    steps:
      - name: Récupère tous les artefacts
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Rassemble et vérifie les checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find incoming -type f \( -name '*.tar.gz' -o -name '*.sha256' \) \
            -exec cp {} dist/ \;
          ( cd dist && shasum -a 256 -c *.sha256 )
          echo "Artefacts vérifiés :"; ls -1 dist

      - name: Crée la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "mcp-runtime ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            dist/*
