name: Release

# Déclenché par le tag annoté vX.Y.Z que tu pousses à la main.
# Le tag EST ta cérémonie d'autorisation ; rien ne se publie sans lui.
on:
  push:
    tags: ["v*"]

# Défaut global : lecture seule, partout. Chaque job élève ce dont il a besoin.
permissions:
  contents: read

jobs:
  # ─── RÔLE « CONSTRUIT » : aucun droit d'écriture, aucun secret ───
  # Ce job exécute le Makefile. C'est le seul endroit où du code candidat
  # s'exécute — donc le seul endroit où un RCE pourrait vivre. Il ne peut
  # ni publier, ni pousser, ni toucher à un token d'écriture.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-14
            target: macos-arm64
          - os: macos-13
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read        # ne peut pas modifier le dépôt
      id-token: write       # OIDC, requis par l'attestation de provenance
      attestations: write   # écrit l'attestation — ce n'est PAS contents: write
    steps:
      # TODO(sécurité) : épingler chaque action sur son SHA 40-hex complet
      # avant merge. Un tag comme @v4 est mutable ; seul le SHA est immuable.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifie que le tag correspond à VERSION
        shell: bash
        run: |
          set -euo pipefail
          file_version="$(cat VERSION)"
          test "v${file_version}" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} != v${file_version} (fichier VERSION)"; exit 1; }

      - name: Dépendances
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libjansson-dev liburiparser-dev
          else
            brew install jansson uriparser
            echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "${GITHUB_ENV}"
          fi

      - name: Build
        run: make all

      - name: Vérifie le runtime
        run: make check

      - name: Empaquète (make install -> tarball)
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          name="mcp-runtime-${version}-${{ matrix.target }}"
          rm -rf stage dist && mkdir -p stage dist
          make install DESTDIR="${PWD}/stage" PREFIX=/usr/local
          tar -czf "dist/${name}.tar.gz" -C stage .
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          echo "artifact=${name}.tar.gz" >> "${GITHUB_OUTPUT}"

      # Lie cryptographiquement le tarball à CE commit, CE workflow, CE runner.
      - name: Atteste la provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/${{ steps.package.outputs.artifact }}

      - name: Publie l'artefact interne
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # ─── RÔLES « AUTORISE » + « PUBLIE » : seul job avec contents: write ───
  # Il ne compile RIEN. Il télécharge des tarballs déjà construits, vérifie
  # leurs checksums (lecture d'octets, aucune exécution de code candidat),
  # et les attache à la Release. L'environnement `release` suspend ce job
  # jusqu'à ton approbation explicite.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # LE seul endroit du workflow
    environment: release
    steps:
      - name: Récupère tous les artefacts
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Rassemble et vérifie les checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find incoming -type f \( -name '*.tar.gz' -o -name '*.sha256' \) \
            -exec cp {} dist/ \;
          ( cd dist && shasum -a 256 -c *.sha256 )
          echo "Artefacts vérifiés :"
          ls -1 dist

      - name: Crée la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "mcp-runtime ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            dist/*
